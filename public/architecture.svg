<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cda250" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for glow -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">CapIAu-CurIA <tspan fill="#cda250">v3.1.0</tspan></text>
    <text x="0" y="24" font-size="13" font-weight="400" fill="#94a3b8">Arquitetura de Produção Serverless, Orquestração Cognitiva e Acervo Audiovisual</text>
  </g>

  <!-- Status / Security Badges Top Right -->
  <g transform="translate(820, 36)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#34d399"/>
    <text x="24" y="17" font-size="11" font-weight="600" fill="#f8fafc">Vercel Edge</text>

    <rect x="115" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="127" cy="13" r="4" fill="#cda250"/>
    <text x="139" y="17" font-size="11" font-weight="600" fill="#f8fafc">React 19 SPA</text>
  </g>

  <!-- Grid Layout Columns -->

  <!-- ========================================================================= -->
  <!-- COLUMN 1: CLIENT LAYER (Frontend & Offline DB) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <!-- Container Card -->
    <rect width="300" height="530" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Header -->
    <rect x="0" y="0" width="300" height="42" rx="12" fill="#1e293b" />
    <path d="M 0 30 L 0 42 L 300 42 L 300 30 Z" fill="#1e293b" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="36" y="25" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.3">CAMADA CLIENTE (BROWSER)</text>

    <!-- Subcard: React 19 SPA -->
    <g transform="translate(16, 56)">
      <rect width="268" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-size="13" font-weight="700" fill="#38bdf8">🖥️ Frontend React 19 + Vite</text>
      
      <text x="14" y="48" font-size="11" font-weight="500" fill="#cbd5e1">• Dashboard com Timeline Glassmorphic</text>
      <text x="14" y="68" font-size="11" font-weight="500" fill="#cbd5e1">• Super Menu 7-em-1 Reordenável</text>
      <text x="14" y="88" font-size="11" font-weight="500" fill="#cbd5e1">• Chatbot Cognitivo CurIA (Rig Builder)</text>
      <text x="14" y="108" font-size="11" font-weight="500" fill="#cbd5e1">• Sanitização Ativa de Links Externos</text>
      <text x="14" y="128" font-size="11" font-weight="500" fill="#cbd5e1">• Roteamento Seguro via /api Relativo</text>
    </g>

    <!-- Subcard: IndexedDB Offline -->
    <g transform="translate(16, 222)">
      <rect width="268" height="140" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-size="13" font-weight="700" fill="#cda250">💾 Dexie.js (IndexedDB Local)</text>
      <text x="14" y="42" font-size="10" font-weight="400" fill="#64748b">Persistência 100% Offline no Navegador</text>

      <g transform="translate(14, 56)">
        <rect x="0" y="0" width="115" height="30" rx="4" fill="#1e293b" />
        <text x="8" y="19" font-size="11" fill="#e2e8f0">⭐ Acervo/Favoritos</text>

        <rect x="123" y="0" width="115" height="30" rx="4" fill="#1e293b" />
        <text x="131" y="19" font-size="11" fill="#e2e8f0">🎬 Rigs Salvos</text>

        <rect x="0" y="38" width="115" height="30" rx="4" fill="#1e293b" />
        <text x="8" y="57" font-size="11" fill="#e2e8f0">🕒 Histórico</text>

        <rect x="123" y="38" width="115" height="30" rx="4" fill="#1e293b" />
        <text x="131" y="57" font-size="11" fill="#e2e8f0">📝 Notas de Campo</text>
      </g>
    </g>

    <!-- Subcard: Segurança do Cliente -->
    <g transform="translate(16, 378)">
      <rect width="268" height="134" rx="8" fill="#0b1329" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#60a5fa">🛡️ Blindagem de Client-Side</text>
      <text x="14" y="44" font-size="11" fill="#94a3b8">• Sem chaves de API no bundle JS</text>
      <text x="14" y="64" font-size="11" fill="#94a3b8">• Prevenção de XSS via `sanitizeUrl`</text>
      <text x="14" y="84" font-size="11" fill="#94a3b8">• Links externos com rel="noopener"</text>
      <text x="14" y="104" font-size="11" fill="#94a3b8">• Modo BYOK opcional via Perfil</text>
    </g>
  </g>

  <!-- Connective Arrow: Client -> Serverless -->
  <g transform="translate(370, 310)">
    <path d="M 0 0 L 40 0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" />
    <polygon points="40,0 32,-5 32,5" fill="#38bdf8" />
    <text x="5" y="-10" font-size="10" font-weight="600" fill="#38bdf8">HTTPS /api</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: VERCEL SERVERLESS / BACKEND LAYER -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 100)" filter="url(#shadow)">
    <!-- Container Card -->
    <rect width="280" height="530" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Header -->
    <rect x="0" y="0" width="280" height="42" rx="12" fill="#1e293b" />
    <path d="M 0 30 L 0 42 L 280 42 L 280 30 Z" fill="#1e293b" />
    <circle cx="22" cy="21" r="5" fill="#34d399" />
    <text x="36" y="25" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.3">VERCEL SERVERLESS / PROXY</text>

    <!-- Subcard: Endpoints -->
    <g transform="translate(16, 56)">
      <rect width="248" height="165" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-size="13" font-weight="700" fill="#34d399">⚡ api/index.js (Express Serverless)</text>
      
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="220" height="24" rx="4" fill="#1e293b"/>
        <text x="8" y="16" font-size="10.5" font-family="monospace" fill="#a7f3d0">POST /api/search</text>

        <rect x="0" y="28" width="220" height="24" rx="4" fill="#1e293b"/>
        <text x="8" y="44" font-size="10.5" font-family="monospace" fill="#a7f3d0">POST /api/plan</text>

        <rect x="0" y="56" width="220" height="24" rx="4" fill="#1e293b"/>
        <text x="8" y="72" font-size="10.5" font-family="monospace" fill="#a7f3d0">POST /api/chat</text>

        <rect x="0" y="84" width="220" height="24" rx="4" fill="#1e293b"/>
        <text x="8" y="100" font-size="10.5" font-family="monospace" fill="#a7f3d0">GET  /api/api-status</text>
      </g>
    </g>

    <!-- Subcard: Motores de Segurança & Anti-Alucinação -->
    <g transform="translate(16, 237)">
      <rect width="248" height="150" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" font-size="12" font-weight="700" fill="#f59e0b">🛡️ Anti-Alucinação &amp; Resiliência</text>

      <text x="14" y="46" font-size="11" fill="#cbd5e1">• Mapeamento LINK_X e THUMB_X</text>
      <text x="14" y="66" font-size="11" fill="#cbd5e1">• Substituição bidirecional de URLs</text>
      <text x="14" y="86" font-size="11" fill="#cbd5e1">• AbortController (Timeouts 45s)</text>
      <text x="14" y="106" font-size="11" fill="#cbd5e1">• Fallback Automático de Modelos</text>
      <text x="14" y="126" font-size="11" fill="#cbd5e1">• Isolamento total de Chaves de API</text>
    </g>

    <!-- Subcard: Vercel Settings -->
    <g transform="translate(16, 402)">
      <rect width="248" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" font-size="12" font-weight="700" fill="#e2e8f0">⚙️ vercel.json &amp; Headers</text>
      
      <text x="14" y="44" font-size="10.5" fill="#94a3b8">• X-Content-Type-Options: nosniff</text>
      <text x="14" y="62" font-size="10.5" fill="#94a3b8">• X-Frame-Options: DENY</text>
      <text x="14" y="80" font-size="10.5" fill="#94a3b8">• Rewrites para SPA (/index.html)</text>
    </g>
  </g>

  <!-- Connective Arrows: Serverless -> AI & External APIs -->
  <g transform="translate(710, 240)">
    <path d="M 0 0 L 30 -60" stroke="#c084fc" stroke-width="2" />
    <polygon points="30,-60 22,-56 26,-48" fill="#c084fc" />
    <text x="15" y="-35" font-size="10" font-weight="600" fill="#c084fc">LLM</text>
  </g>

  <g transform="translate(710, 390)">
    <path d="M 0 0 L 30 60" stroke="#38bdf8" stroke-width="2" />
    <polygon points="30,60 26,48 22,56" fill="#38bdf8" />
    <text x="12" y="38" font-size="10" font-weight="600" fill="#38bdf8">Web RAG</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: EXTERNAL APIS & LLM ECOSYSTEM -->
  <!-- ========================================================================= -->
  
  <!-- Block 3A: LLM Engine -->
  <g transform="translate(750, 100)" filter="url(#shadow)">
    <rect width="290" height="225" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <rect x="0" y="0" width="290" height="38" rx="12" fill="#1e293b" />
    <path d="M 0 26 L 0 38 L 290 38 L 290 26 Z" fill="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#c084fc" />
    <text x="34" y="23" font-size="12.5" font-weight="700" fill="#f8fafc">MOTORES DE IA (LLMs)</text>

    <!-- Google AI Studio -->
    <g transform="translate(14, 50)">
      <rect width="262" height="72" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="22" font-size="12" font-weight="700" fill="#4ade80">⭐ Google AI Studio (Gemini)</text>
      <text x="12" y="40" font-size="10.5" fill="#cbd5e1">Rota Direta de Alta Performance (~3-8s)</text>
      <text x="12" y="58" font-size="10" fill="#94a3b8">Modelos: gemini-2.5-flash / gemini-2.5-pro</text>
    </g>

    <!-- OpenRouter Fallback -->
    <g transform="translate(14, 134)">
      <rect width="262" height="76" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="12" y="22" font-size="12" font-weight="700" fill="#c084fc">🔄 OpenRouter (Multi-Model Hub)</text>
      <text x="12" y="40" font-size="10.5" fill="#cbd5e1">Rota Fallback &amp; Modelos Customizados</text>
      <text x="12" y="58" font-size="10" fill="#94a3b8">Modelos: Llama 3.3, Claude 3.5, DeepSeek R1</text>
    </g>
  </g>

  <!-- Block 3B: Search, RAG & Scraping -->
  <g transform="translate(750, 345)" filter="url(#shadow)">
    <rect width="290" height="285" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    
    <rect x="0" y="0" width="290" height="38" rx="12" fill="#1e293b" />
    <path d="M 0 26 L 0 38 L 290 38 L 290 26 Z" fill="#1e293b" />
    <circle cx="20" cy="19" r="5" fill="#38bdf8" />
    <text x="34" y="23" font-size="12.5" font-weight="700" fill="#f8fafc">BUSCA, RAG &amp; SCRAPING</text>

    <g transform="translate(14, 50)">
      <!-- Serper -->
      <rect x="0" y="0" width="262" height="38" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" font-size="11" font-weight="600" fill="#38bdf8">Serper.dev (Google &amp; Shopping)</text>
      <text x="10" y="31" font-size="9.5" fill="#94a3b8">Preços reais em BRL/USD, ofertas e links de lojas</text>

      <!-- Tavily -->
      <rect x="0" y="44" width="262" height="38" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="62" font-size="11" font-weight="600" fill="#38bdf8">Tavily Search (RAG Engine)</text>
      <text x="10" y="75" font-size="9.5" fill="#94a3b8">Extração contextual otimizada para LLMs</text>

      <!-- Exa.ai -->
      <rect x="0" y="88" width="262" height="38" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="106" font-size="11" font-weight="600" fill="#38bdf8">Exa.ai (Busca Neural Semântica)</text>
      <text x="10" y="119" font-size="9.5" fill="#94a3b8">Destaques conceituais e comparações técnicas</text>

      <!-- Reddit -->
      <rect x="0" y="132" width="262" height="38" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="150" font-size="11" font-weight="600" fill="#f97316">Reddit API OAuth &amp; Fóruns</text>
      <text x="10" y="163" font-size="9.5" fill="#94a3b8">Discussões de r/cinematography, r/filmmakers</text>

      <!-- Scraping Suite -->
      <rect x="0" y="176" width="262" height="46" rx="5" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="194" font-size="11" font-weight="600" fill="#e2e8f0">Scraping Suite (Opcionais)</text>
      <text x="10" y="210" font-size="9.5" fill="#94a3b8">Firecrawl (Markdown) • Diffbot • Scrape.do</text>
    </g>
  </g>

  <!-- Footer Info / Copyright -->
  <g transform="translate(60, 655)">
    <text x="0" y="0" font-size="11" fill="#64748b">CapIAu-CurIA • Arquitetura Modular Serverless • Produzido para o Ecossistema Audiovisual Brasileiro e Global</text>
  </g>
</svg>
